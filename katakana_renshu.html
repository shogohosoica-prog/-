<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カタカナ よみかき</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf4e4; --paper2:#f2e3c2; --ink:#3b2f2a; --sub:#7d6c60;
  --red:#d2453b; --red-d:#a3322a; --ok:#2b9a8a; --ok-l:#d6f0eb; --ng:#e0623f; --ng-l:#fbe0d7;
  --card:#fffdf6; --line:#e3d2ae; --blue:#3f74b8; --yellow:#f6c945; --yellow-l:#fff3c4;
  --shadow:0 3px 0 rgba(59,47,42,.14), 0 8px 18px rgba(59,47,42,.10);
  --kana:'Klee One','UD Digi Kyokasho N-B','YuKyokasho','Hiragino Maru Gothic ProN',serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;
  background:var(--paper);
  background-image:radial-gradient(rgba(210,69,59,.07) 1.5px, transparent 1.6px);
  background-size:22px 22px;
  font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic','Meiryo',sans-serif;
  color:var(--ink);
  -webkit-user-select:none; user-select:none;
}
button{font-family:inherit;color:inherit;cursor:pointer}
.screen{display:none;max-width:1180px;margin:0 auto;padding:20px 16px 48px}
.screen.active{display:block}

/* ---------- common ---------- */
.btn{
  border:none;border-radius:16px;padding:12px 22px;font-size:18px;font-weight:700;
  background:var(--card);box-shadow:var(--shadow);transition:transform .08s, box-shadow .08s, opacity .2s;
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,47,42,.14)}
.btn.primary{background:var(--red);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.ng{background:var(--ng);color:#fff}
.btn.ghost{background:transparent;box-shadow:none;border:2px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.topbar h2{margin:0;font-size:22px;font-weight:900;flex:1;min-width:140px}
.back{padding:8px 14px;font-size:15px}
.pill{background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;box-shadow:var(--shadow);font-size:15px;white-space:nowrap}

/* ---------- menu ---------- */
.hero{text-align:center;padding:24px 0 8px}
.hero h1{font-size:clamp(34px,7vw,60px);margin:0;font-weight:900;letter-spacing:.06em}
.hero h1 .k{color:var(--red)}
.hero p{color:var(--sub);font-size:18px;margin:8px 0 0}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,300px));gap:22px;justify-content:center;margin:32px 0}
@media (max-width:640px){.modes{grid-template-columns:minmax(0,340px)}}
.mode{
  border:none;background:var(--card);border-radius:26px;padding:26px 20px 22px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;gap:10px;transition:transform .12s;
  border:3px solid transparent;
}
.mode:hover{transform:translateY(-3px);border-color:var(--yellow)}
.mode .big{font-family:var(--kana);font-size:64px;line-height:1;width:110px;height:110px;display:grid;place-items:center;border-radius:20px;color:#fff}
.mode.yomi .big{background:var(--red)}
.mode.kaki .big{background:var(--blue)}
.mode b{font-size:28px;font-weight:900}
.mode span{color:var(--sub);font-size:16px;text-wrap:balance}
.hero{position:relative;max-width:1100px;margin:0 auto;padding:46px 200px 4px;min-height:262px;text-align:center}
.deco{position:absolute;pointer-events:none;filter:drop-shadow(0 5px 6px rgba(59,47,42,.18));--r:0deg;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-9px) rotate(var(--r))}}
.h-left{left:10px;top:6px;width:160px;--r:-7deg}
.h-left2{left:140px;top:150px;width:96px;--r:8deg;animation-delay:-1.2s}
.h-right{right:14px;top:14px;width:150px;--r:7deg;animation-delay:-.6s}
.h-right2{right:150px;top:158px;width:84px;--r:-9deg;animation-delay:-2s}
.ribbon{position:relative;display:inline-block;background:#fff;border-radius:999px;padding:16px 38px;
  box-shadow:0 0 0 5px var(--red), 0 0 0 9px #fff, var(--shadow)}
.ribbon::after{content:"";position:absolute;inset:7px;border:2px dashed #f2b3ad;border-radius:999px;pointer-events:none}
.ribbon h1{font-size:clamp(30px,5.2vw,54px);margin:0;font-weight:900;letter-spacing:.06em;white-space:nowrap}
.ribbon h1 .k{color:var(--red)}
.h-top{top:-46px;right:20px;width:70px;--r:4deg;animation-duration:2.4s}
.hero-q{color:var(--sub);font-size:20px;font-weight:700;margin:22px 0 0}
.spark{position:absolute;font-size:22px;animation:twinkle 2.2s ease-in-out infinite;pointer-events:none}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.mode{position:relative;padding-top:30px}
.peek{position:absolute;top:-46px;left:-26px;width:104px;transform:rotate(-10deg);filter:drop-shadow(0 5px 6px rgba(59,47,42,.2));transition:transform .25s;pointer-events:none}
.mode.kaki .peek{left:auto;right:-24px;transform:rotate(10deg);width:96px}
.mode:hover .peek{transform:rotate(0deg) translateY(-8px) scale(1.06)}
.parade-wrap{max-width:980px;margin:6px auto 0;background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:18px 14px 8px;position:relative;overflow:hidden}
.parade-wrap::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:#cfe6b8;
  -webkit-mask:radial-gradient(14px 10px at 14px 0,transparent 98%,#000) -14px 0/28px 100%;mask:radial-gradient(14px 10px at 14px 0,transparent 98%,#000) -14px 0/28px 100%}
.parade-title{text-align:center}
.parade-title span{display:inline-block;background:var(--red);color:#fff;font-weight:900;border-radius:999px;padding:6px 18px;font-size:16px}
.parade{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:4px 10px;padding:14px 0 10px;position:relative;z-index:1}
.parade .pal{display:block;--r:0deg;animation:bob 2.8s ease-in-out infinite;cursor:pointer}
.parade img{display:block;height:104px;max-width:128px;object-fit:contain;filter:drop-shadow(0 4px 5px rgba(59,47,42,.18))}
.parade img.jump{animation:jump .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes jump{0%{transform:translateY(0)}30%{transform:translateY(-34px) rotate(-8deg)}60%{transform:translateY(0) rotate(6deg) scaleY(.9)}100%{transform:none}}
@media (max-width:760px){
  .hero{padding:118px 6px 4px;min-height:0}
  .h-left{width:98px;top:0;left:2px}.h-left2{width:62px;left:96px;top:44px}
  .h-right{width:92px;top:4px;right:2px}.h-right2{width:56px;right:96px;top:50px}
  .ribbon{padding:12px 22px}.h-top{width:46px;top:-40px;right:auto;left:calc(50% - 23px)}
  .spark{display:none}
  .parade img{height:78px;max-width:96px}
}

/* ---------- settings ---------- */
.panel{background:var(--card);border-radius:24px;padding:22px;box-shadow:var(--shadow)}
.group-title{font-weight:900;font-size:17px;margin:4px 0 10px;color:var(--sub)}
.rowgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.rowbtn{
  border:3px solid var(--line);background:#fff;border-radius:16px;padding:10px 12px;text-align:left;
  display:flex;flex-direction:column;gap:2px;transition:background .12s,border-color .12s;
}
.rowbtn b{font-size:19px}
.rowbtn span{font-size:15px;color:var(--sub);letter-spacing:.1em}
.rowbtn.on{border-color:var(--red);background:#fde9e6}
.rowbtn.on b::before{content:"✓ ";color:var(--red)}
.quick{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.quick .btn{font-size:15px;padding:8px 14px}
.opt{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;margin:6px 0 4px}
.opt input{width:22px;height:22px;accent-color:var(--blue)}
.startbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
.startbar .count{font-weight:700;color:var(--sub)}
.startbar .btn{font-size:22px;padding:14px 34px}

/* ---------- yomi ---------- */
.yboard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.yboard{grid-template-columns:1fr}}
.yrows{display:flex;flex-direction:column;gap:12px}
.yrow{background:var(--card);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow)}
.ylabel{font-size:14px;font-weight:700;color:var(--sub);margin:0 0 6px 4px}
.pairs{display:flex;gap:10px;flex-wrap:wrap}
.pair{display:flex;align-items:center;gap:4px;background:var(--paper);border-radius:14px;padding:5px}
.hira{width:50px;height:58px;display:grid;place-items:center;font-size:32px;font-weight:700}
.slot{
  width:62px;height:62px;border-radius:12px;border:3px dashed #cdb894;background:#fff;
  display:grid;place-items:center;transition:background .12s,border-color .12s;position:relative;
}
.slot.hover{background:var(--yellow-l);border-color:var(--yellow);border-style:solid}
.slot.ok{border-color:var(--ok);border-style:solid;background:var(--ok-l)}
.slot.ng{border-color:var(--ng);border-style:solid;background:var(--ng-l);animation:shake .4s}
.slot.ok::after{content:"◯";position:absolute;right:-8px;top:-10px;font-size:18px;color:var(--ok);font-weight:900}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fieldwrap{position:sticky;top:12px}
.field{
  position:relative;border-radius:22px;min-height:300px;
  background:#5b8a54;
  background-image:linear-gradient(rgba(255,255,255,.05) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.05) 2px,transparent 2px);
  background-size:40px 40px;
  box-shadow:inset 0 0 0 6px #4a7444, var(--shadow);
}
.field-note{color:#fff;opacity:.8;font-size:14px;position:absolute;left:16px;top:10px;font-weight:700;pointer-events:none}
.kcard{
  position:absolute;width:58px;height:58px;border-radius:10px;
  background:var(--card);border:3px solid var(--red);
  box-shadow:0 0 0 3px var(--card) inset, 0 4px 8px rgba(0,0,0,.25);
  font-family:var(--kana);font-size:34px;display:grid;place-items:center;line-height:1;
  cursor:grab;touch-action:none;transition:box-shadow .12s;
}
.kcard.inslot{position:static;width:52px;height:52px;transform:none !important;box-shadow:0 2px 4px rgba(0,0,0,.18);font-size:31px}
.kcard.dragging{position:fixed;z-index:1000;cursor:grabbing;pointer-events:none;box-shadow:0 12px 24px rgba(0,0,0,.35);transition:none}
.kcard.locked{cursor:default;border-color:var(--ok)}
.ycheck{margin-top:14px;display:flex;justify-content:center}
.ycheck .btn{font-size:22px;padding:14px 36px}
.ycheck .btn.ready{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* ---------- kaki ---------- */
.kbar{height:10px;border-radius:999px;background:var(--paper2);overflow:hidden;margin:-6px 0 20px}
.kbar i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}
.kstage{display:grid;grid-template-columns:auto auto auto;gap:22px;align-items:center;justify-content:center}
.kside{display:flex;flex-direction:column;align-items:center;gap:8px}
.kside small{font-weight:700;color:var(--sub);font-size:15px}
.ktile{width:130px;height:130px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:84px;font-weight:700}
.ktile.ans{font-family:var(--kana);color:var(--red);font-size:90px}
.ktile.ans.hidden{color:var(--line);font-family:inherit}
.wbox{
  position:relative;width:min(360px,86vw);aspect-ratio:1;border-radius:18px;background:#fff;
  box-shadow:0 0 0 4px var(--blue), var(--shadow);overflow:hidden;
  background-image:
    linear-gradient(90deg, transparent calc(50% - 1px), rgba(63,116,184,.28) calc(50% - 1px), rgba(63,116,184,.28) calc(50% + 1px), transparent calc(50% + 1px)),
    linear-gradient(transparent calc(50% - 1px), rgba(63,116,184,.28) calc(50% - 1px), rgba(63,116,184,.28) calc(50% + 1px), transparent calc(50% + 1px));
}
.wsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.wsvg .st{fill:none;stroke-linecap:round;stroke-linejoin:round}
#wGuide .st{stroke:rgba(59,47,42,.16);stroke-width:5}
#wGuide .dot{fill:rgba(210,69,59,.55)}
#wGuide .num circle{fill:rgba(210,69,59,.75)}
#wAnswer .st{stroke:rgba(210,69,59,.38);stroke-width:4}
#wAnswer .dot{fill:var(--red)}
#wAnswer .num circle{fill:var(--red)}
.wsvg .num text{fill:#fff;font-size:6.5px;font-weight:900;text-anchor:middle;dominant-baseline:central;font-family:'Zen Maru Gothic',sans-serif}
.stamp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:min(280px,70vw);font-weight:900;line-height:1;opacity:0}
.stamp.ok{color:rgba(43,154,138,.55);animation:stamp .45s cubic-bezier(.2,1.6,.4,1) forwards}
.stamp.ng{color:rgba(224,98,63,.55);animation:stamp .45s cubic-bezier(.2,1.6,.4,1) forwards, stampfade .6s 1.3s forwards}
@keyframes stampfade{from{opacity:1}to{opacity:.12}}
@keyframes stamp{from{opacity:0;transform:scale(1.6)}to{opacity:1;transform:scale(1)}}
.ktoast{text-align:center;min-height:28px;margin-top:12px;font-weight:900;font-size:18px;color:var(--ng)}
.ktoast.good{color:var(--ok)}
.mbtns .tiny{font-size:12px;padding:6px 10px;opacity:.7;flex-basis:100%;max-width:max-content;margin:4px auto 0}
.wbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.kactions{display:flex;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.kactions .btn{min-width:130px}
.ktools{display:flex;justify-content:center;gap:16px;margin-top:14px;align-items:center;flex-wrap:wrap}
@media (max-width:760px){
  .kstage{grid-template-columns:1fr 1fr;grid-template-areas:"h a" "w w";gap:14px;justify-items:center}
  .kside.h{grid-area:h}.kside.a{grid-area:a}.wbox{grid-area:w}
  .ktile{width:100px;height:100px;font-size:64px}.ktile.ans{font-size:70px}
}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(40,30,25,.55);display:none;align-items:center;justify-content:center;z-index:2000;padding:16px}
.overlay.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mcard{
  background:var(--card);border-radius:28px;padding:22px 22px 20px;max-width:440px;width:100%;
  text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .35s cubic-bezier(.2,1.6,.4,1);
}
.mcard.miss{background:#2a2424;color:#fff}
@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}
.mimg{height:min(280px,42vh);max-width:100%;object-fit:contain;border-radius:18px;background:#fff;display:block;margin:0 auto}
.mcard.miss .mimg{background:#fff}
.mname{display:inline-block;margin-top:12px;background:var(--red);color:#fff;border-radius:999px;padding:4px 14px;font-weight:900;font-size:15px}
.mcard.miss .mname{background:#000;border:2px solid #fff}
.bubble{
  position:relative;margin:14px 0 6px;background:#fff;color:var(--ink);border-radius:18px;padding:14px 16px;
  font-size:22px;font-weight:900;line-height:1.5;border:3px solid var(--ink);
}
.bubble::before{content:"";position:absolute;top:-14px;left:50%;margin-left:-10px;border:10px solid transparent;border-bottom-color:var(--ink);border-top:0;border-width:0 10px 14px}
.mcard.miss .bubble{border-color:var(--red);color:#2a2424}
.mcard.miss .bubble::before{border-bottom-color:var(--red)}
.mnote{font-size:15px;color:var(--sub);margin:6px 0 0;font-weight:700}
.mcard.miss .mnote{color:#e8cfc8}
.mcard.miss .btn:not(.primary):not(.ghost){color:var(--ink)}
.mcard.miss .btn.ghost{color:#e8cfc8;border-color:#6b5a55}
.mbtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:1999;pointer-events:none;animation:fall linear forwards;border-radius:2px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>

<!-- MENU -->
<section class="screen active" id="menu">
  <div class="hero">
    <span class="spark" style="left:30%;top:6px;color:#f6c945">✦</span>
    <span class="spark" style="left:66%;top:0;color:#f19ab8;animation-delay:.6s">♥</span>
    <span class="spark" style="left:22%;top:200px;color:#8ec5e8;animation-delay:1.1s">✦</span>
    <span class="spark" style="left:76%;top:206px;color:#f6c945;animation-delay:.3s">★</span>
    <img class="deco h-left" data-s="mm_melody" alt="">
    <img class="deco h-left2" data-s="mm_kuromi" alt="">
    <img class="deco h-right" data-s="ck_chiikawa" alt="">
    <img class="deco h-right2" data-s="ck_hachiware" alt="">
    <div class="ribbon">
      <img class="deco h-top" data-s="mm_tori" alt="">
      <h1><span class="k">カタカナ</span> れんしゅう</h1>
    </div>
    <p class="hero-q">どっちで あそぶ？</p>
  </div>
  <div class="modes">
    <button class="mode yomi" data-mode="yomi">
      <img class="peek" data-s="os_ot" alt="">
      <div class="big">ア</div>
      <b>よみ</b>
      <span>ひらがなに あう カタカナを ならべよう</span>
    </button>
    <button class="mode kaki" data-mode="kaki">
      <img class="peek" data-s="os_br" alt="">
      <div class="big">カ</div>
      <b>かき</b>
      <span>ひらがなを みて カタカナを かこう</span>
    </button>
  </div>
  <div class="parade-wrap">
    <div class="parade-title"><span>いっしょに がんばる おともだち</span></div>
    <div class="parade" id="parade"></div>
  </div>
</section>

<!-- SETTINGS -->
<section class="screen" id="settings">
  <div class="topbar">
    <button class="btn back" data-go="menu">← もどる</button>
    <h2 id="setTitle"></h2>
  </div>
  <div class="panel">
    <div class="quick">
      <button class="btn" id="qAll">ごじゅうおん ぜんぶ</button>
      <button class="btn" id="qEvery">だくおんも いれて ぜんぶ</button>
      <button class="btn ghost" id="qNone">ぜんぶ はずす</button>
    </div>
    <div class="group-title">ごじゅうおん</div>
    <div class="rowgrid" id="gridBasic"></div>
    <div class="group-title">だくおん・はんだくおん</div>
    <div class="rowgrid" id="gridExtra"></div>
    <div id="kakiOpts">
      <div class="group-title">かき の せってい</div>
      <label class="opt"><input type="checkbox" id="optShuffle"> じゅんばんを まぜる</label>
      <label class="opt"><input type="checkbox" id="optTrace"> うすい おてほん（かきじゅん つき）</label>
    </div>
    <div class="startbar">
      <span class="count" id="setCount"></span>
      <button class="btn primary" id="startBtn">スタート！</button>
    </div>
  </div>
</section>

<!-- YOMI -->
<section class="screen" id="yomi">
  <div class="topbar">
    <button class="btn back" data-go="settings">← せってい</button>
    <h2>よみ：カタカナを ならべよう</h2>
    <span class="pill" id="yProg"></span>
  </div>
  <div class="yboard">
    <div class="yrows" id="yRows"></div>
    <div class="fieldwrap">
      <div class="field" id="field"><div class="field-note">カードを ひらがなの となりへ ドラッグ！</div></div>
      <div class="ycheck"><button class="btn primary" id="yCheck" disabled>こたえあわせ</button></div>
    </div>
  </div>
</section>

<!-- KAKI -->
<section class="screen" id="kaki">
  <div class="topbar">
    <button class="btn back" data-go="settings">← せってい</button>
    <h2>かき：カタカナを かこう</h2>
    <span class="pill" id="kProg"></span>
  </div>
  <div class="kbar"><i id="kBar"></i></div>
  <div class="kstage">
    <div class="kside h"><small>ひらがな</small><div class="ktile" id="kHira"></div></div>
    <div class="wbox" id="wbox">
      <svg class="wsvg" id="wGuide" viewBox="0 0 109 109"></svg>
      <svg class="wsvg" id="wAnswer" viewBox="0 0 109 109"></svg>
      <canvas id="cv"></canvas>

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

}

/* ---------------- modal ---------------- */
function showModal(who, note, buttons){
  $('#mcard').classList.toggle('miss', !!who.miss);
  $('#mImg').src = who.img; $('#mImg').alt = who.name;
  $('#mName').textContent = who.name;
  $('#mText').textContent = '「' + who.text + '」';
  $('#mNote').textContent = note || '';
  $('#mNote').style.display = note ? '' : 'none';
  const box = $('#mBtns'); box.innerHTML = '';
  buttons.forEach(b => {
    const btn = el('button', 'btn ' + (b.cls || ''), b.label);
    btn.onclick = () => { $('#overlay').classList.remove('show'); b.fn && b.fn(); };
    box.append(btn);
  });
  $('#overlay').classList.add('show');
  if (!who.miss) confetti();
}
function confetti(){
  const colors = ['#d2453b','#f6c945','#3f74b8','#2b9a8a','#f19ab8'];
  for (let i = 0; i < 50; i++){
    const c = el('div', 'confetti');
    c.style.left = rand(0, 100) + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = rand(1.6, 3) + 's';
    c.style.animationDelay = rand(0, .5) + 's';
    document.body.append(c);
    setTimeout(() => c.remove(), 3800);
  }
}
const pickReward = () => REWARDS[Math.floor(Math.random() * REWARDS.length)];

/* ---------------- settings ---------------- */
function renderSettings(){
  $('#setTitle').textContent = (mode === 'yomi' ? 'よみ' : 'かき') + '：どの ぎょうを する？';
  $('#kakiOpts').style.display = mode === 'kaki' ? '' : 'none';
  const gb = $('#gridBasic'), ge = $('#gridExtra'); gb.innerHTML = ''; ge.innerHTML = '';
  ROWS.forEach(r => {
    const b = el('button', 'rowbtn' + (selected.has(r.id) ? ' on' : ''));
    b.append(el('b', '', r.name), el('span', '', [...r.h].join(' ')));
    b.onclick = () => { selected.has(r.id) ? selected.delete(r.id) : selected.add(r.id); renderSettings(); };
    (r.extra ? ge : gb).append(b);
  });
  const n = ROWS.filter(r => selected.has(r.id)).reduce((s, r) => s + r.h.length, 0);
  $('#setCount').textContent = n ? `ぜんぶで ${n} もじ` : 'ぎょうを えらんでね';
  $('#startBtn').disabled = n === 0;
}
$('#qAll').onclick = () => { selected.clear(); ROWS.filter(r => !r.extra).forEach(r => selected.add(r.id)); renderSettings(); };
$('#qEvery').onclick = () => { ROWS.forEach(r => selected.add(r.id)); renderSettings(); };
$('#qNone').onclick = () => { selected.clear(); renderSettings(); };
$('#startBtn').onclick = () => mode === 'yomi' ? startYomi() : startKaki();
const chosenRows = () => ROWS.filter(r => selected.has(r.id));

/* ---------------- YOMI ---------------- */
const field = $('#field');
let yBusy = false;

function startYomi(){
  yBusy = false;
  const rowsEl = $('#yRows'); rowsEl.innerHTML = '';
  const kana = [];
  chosenRows().forEach(r => {
    const row = el('div', 'yrow');
    row.append(el('div', 'ylabel', r.name));
    const pairs = el('div', 'pairs');
    [...r.h].forEach((h, i) => {
      const p = el('div', 'pair');
      const s = el('div', 'slot'); s.dataset.ans = [...r.k][i];
      p.append(el('div', 'hira', h), s);
      pairs.append(p);
      kana.push([...r.k][i]);
    });
    row.append(pairs); rowsEl.append(row);
  });
  field.querySelectorAll('.kcard').forEach(c => c.remove());
  show('yomi');
  const cards = shuffle(kana).map(k => { const c = el('div', 'kcard', k); c.dataset.k = k; attachDrag(c); return c; });
  sizeField(cards.length);
  scatter(cards);
  updateYomi();
}

function sizeField(n){
  const w = field.clientWidth || 500;
  const cols = Math.max(3, Math.floor((w - 20) / 88));
  const rows = Math.ceil(n / cols);
  field.style.minHeight = Math.max(300, rows * 92 + 70) + 'px';
}
function setFieldPos(c, x, y, rot){
  c.classList.remove('inslot', 'dragging');
  if (c.parentElement !== field) field.append(c);
  c.style.left = x + '%'; c.style.top = y + '%';
  c.dataset.rot = rot;
  c.style.transform = `translate(-50%,-50%) rotate(${rot}deg)`;
}
function scatter(cards){
  const w = field.clientWidth, h = field.clientHeight;
  const cols = Math.max(3, Math.floor((w - 20) / 88));
  const rows = Math.max(1, Math.ceil(cards.length / cols));
  const top0 = 50 / h * 100; // leave space for the note
  const cells = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) cells.push([c, r]);
  shuffle(cells);
  cards.forEach((card, i) => {
    const [c, r] = cells[i];
    const x = (c + 0.5) / cols * 100 + rand(-18, 18) / cols;
    const y = top0 + (r + 0.5) / rows * (100 - top0 - 4) + rand(-14, 14) / rows;
    setFieldPos(card, Math.min(94, Math.max(6, x)), Math.min(94, Math.max(top0, y)), Math.round(rand(-16, 16)));
  });
}
function returnToField(card){
  const w = field.clientWidth, h = field.clientHeight;
  const others = [...field.querySelectorAll('.kcard')].filter(c => c !== card)
    .map(c => [parseFloat(c.style.left) / 100 * w, parseFloat(c.style.top) / 100 * h]);
  let best = null, bestD = -1;
  for (let t = 0; t < 40; t++){
    const x = rand(8, 92), y = rand(Math.max(8, 55 / h * 100), 92);
    const px = x / 100 * w, py = y / 100 * h;
    const d = others.length ? Math.min(...others.map(([ox, oy]) => Math.hypot(ox - px, oy - py))) : 999;
    if (d > bestD){ bestD = d; best = [x, y]; }
    if (d > 80) break;
  }
  setFieldPos(card, best[0], best[1], Math.round(rand(-16, 16)));
}
function putInSlot(card, slot){
  slot.append(card);
  card.classList.add('inslot'); card.classList.remove('dragging');
  card.style.left = card.style.top = ''; card.style.transform = '';
}

let drag = null, hoverSlot = null;
function attachDrag(c){
  c.addEventListener('pointerdown', e => {
    if (yBusy || c.classList.contains('locked') || drag) return;
    e.preventDefault();
    const r = c.getBoundingClientRect();
    drag = { c, from: c.parentElement, left: c.style.left, top: c.style.top, rot: c.dataset.rot || 0,
             dx: e.clientX - (r.left + r.width / 2), dy: e.clientY - (r.top + r.height / 2), id: e.pointerId };
    c.classList.remove('inslot');
    c.classList.add('dragging');
    document.body.append(c);
    moveDrag(e);
    window.addEventListener('pointermove', moveDrag);
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', cancelDrag);
  });
}
function slotAt(x, y){
  const t = document.elementFromPoint(x, y);
  const s = t && t.closest('.slot');
  return s && !s.classList.contains('ok') ? s : null;
}
function moveDrag(e){
  if (!drag || e.pointerId !== drag.id) return;
  const c = drag.c;
  c.style.left = (e.clientX - drag.dx) + 'px';
  c.style.top = (e.clientY - drag.dy) + 'px';
  c.style.transform = 'translate(-50%,-50%) scale(1.12)';
  const s = slotAt(e.clientX, e.clientY);
  if (s !== hoverSlot){ hoverSlot && hoverSlot.classList.remove('hover'); hoverSlot = s; s && s.classList.add('hover'); }
  if (e.clientY < 50) window.scrollBy(0, -14);
  else if (e.clientY > innerHeight - 50) window.scrollBy(0, 14);
}
function stopListening(){
  window.removeEventListener('pointermove', moveDrag);
  window.removeEventListener('pointerup', endDrag);
  window.removeEventListener('pointercancel', cancelDrag);
  hoverSlot && hoverSlot.classList.remove('hover'); hoverSlot = null;
}
function backToOrigin(){
  const { c, from, left, top, rot } = drag;
  if (from.classList.contains('slot')) putInSlot(c, from);
  else setFieldPos(c, parseFloat(left), parseFloat(top), rot);
}
function cancelDrag(e){
  if (!drag || e.pointerId !== drag.id) return;
  stopListening(); backToOrigin(); drag = null; updateYomi();
}
function endDrag(e){
  if (!drag || e.pointerId !== drag.id) return;
  stopListening();
  const { c, from } = drag;
  const slot = slotAt(e.clientX, e.clientY);
  if (slot){
    const occ = slot.querySelector('.kcard');
    if (occ){
      if (from.classList.contains('slot')) putInSlot(occ, from);
      else setFieldPos(occ, parseFloat(drag.left), parseFloat(drag.top), drag.rot);
    }
    putInSlot(c, slot);
  } else {
    const fr = field.getBoundingClientRect();
    const cx = e.clientX - drag.dx, cy = e.clientY - drag.dy;
    if (cx >= fr.left && cx <= fr.right && cy >= fr.top && cy <= fr.bottom){
      const x = (cx - fr.left) / fr.width * 100, y = (cy - fr.top) / fr.height * 100;
      setFieldPos(c, Math.min(95, Math.max(5, x)), Math.min(95, Math.max(5, y)), Math.round(rand(-10, 10)));
    } else if (from.classList.contains('slot')) {
      returnToField(c);
    } else {
      backToOrigin();
    }
  }
  drag = null;
  updateYomi();
}

function updateYomi(){
  const slots = [...document.querySelectorAll('#yRows .slot')];
  const filled = slots.filter(s => s.querySelector('.kcard')).length;
  $('#yProg').textContent = `おいた ${filled} / ${slots.length}`;
  const btn = $('#yCheck');
  const done = filled === slots.length && slots.length > 0;
  btn.disabled = !done;
  btn.classList.toggle('ready', done);
  btn.textContent = done ? 'こたえあわせ！' : `のこり ${slots.length - filled} まい`;
}

$('#yCheck').onclick = () => {
  if (yBusy) return;
  yBusy = true;
  const slots = [...document.querySelectorAll('#yRows .slot')];
  const wrong = [];
  slots.forEach(s => {
    const c = s.querySelector('.kcard');
    if (s.classList.contains('ok')) return;
    if (c && c.dataset.k === s.dataset.ans){ s.classList.add('ok'); c.classList.add('locked'); }
    else { s.classList.add('ng'); wrong.push([s, c]); }
  });
  setTimeout(() => {
    if (wrong.length){
      showModal(MISS, `まちがい：${wrong.length} こ`, [{
        label:'もういちど やってみる', cls:'primary',
        fn:() => { wrong.forEach(([s, c]) => { s.classList.remove('ng'); c && returnToField(c); }); yBusy = false; updateYomi(); }
      }]);
    } else {
      showModal(pickReward(), `${slots.length} もじ ぜんぶ せいかい！`, [
        {label:'もういちど', cls:'primary', fn:startYomi},
        {label:'ほかの ぎょう', fn:() => { renderSettings(); show('settings'); }},
        {label:'メニュー', cls:'ghost', fn:() => show('menu')},
      ]);
    }
  }, 750);
};

const SVGNS = 'http://www.w3.org/2000/svg';
const cv = $('#cv'), ctx = cv.getContext('2d');
let K = { list:[], i:0, missed:new Set(), trace:false };
let strokes = [], drawing = false;

function startKaki(){
  const list = [];
  chosenRows().forEach(r => { const ks = [...r.k]; [...r.h].forEach((h, i) => list.push({ h, k: ks[i] })); });
  if ($('#optShuffle').checked) shuffle(list);
  runKaki(list);
}
function runKaki(list){
  K = { list, i:0, missed:new Set(), trace: $('#optTrace').checked };
  show('kaki');
  fitCanvas();
  renderKaki();
}

/* かきじゅん（ばんごう・はじまりの てん・やじるし）を かく */
const svgEl = (tag, attrs) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
function drawOrder(svg, ch, color){
  svg.innerHTML = '';
  const data = STROKES[ch];
  const mid = svg.id + '-arrow';
  const defs = svgEl('defs', {});
  const marker = svgEl('marker', { id: mid, viewBox:'0 0 10 10', refX:'3', refY:'5', markerWidth:'7', markerHeight:'7', markerUnits:'userSpaceOnUse', orient:'auto' });
  marker.append(svgEl('path', { d:'M0,0 L10,5 L0,10 z', fill: color }));
  defs.append(marker); svg.append(defs);
  data.d.forEach(d => svg.append(svgEl('path', { d, class:'st', 'marker-end':`url(#${mid})` })));
  data.d.forEach((d, i) => {
    const m = d.match(/^M\s*(-?[\d.]+)[\s,]*(-?[\d.]+)/);
    if (m) svg.append(svgEl('circle', { cx:m[1], cy:m[2], r:'2.4', class:'dot' }));
    const [nx, ny] = data.n[i];
    const g = svgEl('g', { class:'num' });
    const cx = nx + 2.4, cy = ny - 3;
    g.append(svgEl('circle', { cx, cy, r:'4.3' }));
    const t = svgEl('text', { x:cx, y:cy + .2 }); t.textContent = i + 1;
    g.append(t); svg.append(g);
  });
}

function renderKaki(){
  const it = K.list[K.i];
  $('#kHira').textContent = it.h;
  $('#kAns').textContent = '？'; $('#kAns').classList.add('hidden');
  drawOrder($('#wGuide'), it.k, 'rgba(210,69,59,.55)');
  $('#wGuide').style.display = K.trace ? '' : 'none';
  $('#wAnswer').innerHTML = '';
  $('#stamp').className = 'stamp'; $('#stamp').textContent = '';
  toast('');
  $('#kProg').textContent = `${K.i + 1} / ${K.list.length}`;
  $('#kBar').style.width = (K.i / K.list.length * 100) + '%';
  strokes = []; redraw();
  setKActions([{label:'こたえを みる', cls:'primary', fn:check}]);
}
function setKActions(list){
  const box = $('#kActions'); box.innerHTML = '';
  list.forEach(b => { const btn = el('button', 'btn ' + (b.cls || ''), b.label); btn.onclick = b.fn; box.append(btn); });
}
let toastTimer;
function toast(msg, good){
  const t = $('#ktoast'); t.textContent = msg; t.classList.toggle('good', !!good);
}
function stamp(ok){
  const s = $('#stamp'); s.className = 'stamp'; void s.offsetWidth;
  s.textContent = ok ? '◯' : '✕'; s.classList.add(ok ? 'ok' : 'ng');
}

function check(){
  if (!strokes.length){ toast('かいてから おしてね'); return; }
  const it = K.list[K.i];
  const res = judge(strokes, it.k);
  $('#kAns').textContent = it.k; $('#kAns').classList.remove('hidden');
  $('#wGuide').style.display = 'none';
  drawOrder($('#wAnswer'), it.k, '#d2453b');
  stamp(res.ok);
  if (res.ok){
    toast('よく かけました！', true);
    setKActions([{label:'つぎへ →', cls:'ok', fn:next}]);
  } else {
    K.missed.add(K.i);
    toast(res.hint);
    setKActions([{label:'もういちど かく', cls:'primary', fn:renderKaki}]);
    setTimeout(() => showModal(MISS, res.hint, [
      {label:'もういちど かく', cls:'primary', fn:renderKaki},
      {label:'こたえと くらべる', fn:() => {}},
      {label:'おとなの かたへ：ただしく かけていたら ◯に する', cls:'ghost tiny', fn:() => { K.missed.delete(K.i); next(); }},
    ]), 700);
  }
}
function next(){
  K.i++;
  if (K.i < K.list.length) { renderKaki(); return; }
  $('#kBar').style.width = '100%';
  const miss = [...K.missed].map(i => K.list[i]);
  const note = miss.length
    ? `${K.list.length} もじ かけたね！ にがてな もじ：${miss.map(m => m.k).join(' ')}`
    : `${K.list.length} もじ ぜんぶ かけたね！`;
  const btns = [];
  if (miss.length) btns.push({label:'にがてな もじだけ もういちど', cls:'primary', fn:() => runKaki(miss)});
  btns.push({label:'もういちど', cls: miss.length ? '' : 'primary', fn:startKaki});
  btns.push({label:'ほかの ぎょう', fn:() => { renderSettings(); show('settings'); }});
  btns.push({label:'メニュー', cls:'ghost', fn:() => show('menu')});
  showModal(pickReward(), note, btns);
}
$('#kClear').onclick = () => { strokes = []; redraw(); };
$('#kUndo').onclick = () => { strokes.pop(); redraw(); };

/* ---------- じどう はんてい（あらめ） ----------
   1) かくすう が おなじか
   2) かくじゅん どおりに、1かくずつ かたち・いち・むき を くらべる
      （もじ ぜんたいの おおきさと ばしょは そろえてから くらべる） */
const TH_STROKE = 0.24, TH_MEAN = 0.16;
const refCache = {};
let measurePath = null;
function refStrokes(ch){
  if (refCache[ch]) return refCache[ch];
  if (!measurePath){
    const s = svgEl('svg', { width:'0', height:'0' });
    s.style.cssText = 'position:absolute;left:-9999px;visibility:hidden';
    measurePath = svgEl('path', {}); s.append(measurePath); document.body.append(s);
  }
  refCache[ch] = STROKES[ch].d.map(d => {
    measurePath.setAttribute('d', d);
    const L = measurePath.getTotalLength(), pts = [];
    for (let i = 0; i <= 40; i++){ const p = measurePath.getPointAtLength(L * i / 40); pts.push([p.x / 109, p.y / 109]); }
    return pts;
  });
  return refCache[ch];
}
function resample(s, n = 24){
  if (s.length === 1) return Array.from({ length:n }, () => s[0]);
  const acc = [0];
  for (let i = 1; i < s.length; i++) acc.push(acc[i - 1] + Math.hypot(s[i][0] - s[i - 1][0], s[i][1] - s[i - 1][1]));
  const L = acc[acc.length - 1];
  if (L === 0) return Array.from({ length:n }, () => s[0]);
  const out = []; let j = 0;
  for (let k = 0; k < n; k++){
    const t = L * k / (n - 1);
    while (j < acc.length - 2 && acc[j + 1] < t) j++;
    const seg = acc[j + 1] - acc[j], r = seg ? (t - acc[j]) / seg : 0;
    out.push([s[j][0] + (s[j + 1][0] - s[j][0]) * r, s[j][1] + (s[j + 1][1] - s[j][1]) * r]);
  }
  return out;
}
function normalize(set){
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  set.forEach(s => s.forEach(([x, y]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }));
  const sc = Math.max(x1 - x0, y1 - y0, 0.05), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  return set.map(s => s.map(([x, y]) => [(x - cx) / sc, (y - cy) / sc]));
}
function reversed(u, r){
  const uv = [u[u.length - 1][0] - u[0][0], u[u.length - 1][1] - u[0][1]];
  const rv = [r[r.length - 1][0] - r[0][0], r[r.length - 1][1] - r[0][1]];
  const ul = Math.hypot(...uv), rl = Math.hypot(...rv);
  if (ul < 0.04 || rl < 0.04) return false;
  return (uv[0] * rv[0] + uv[1] * rv[1]) / (ul * rl) < -0.3;
}
const pdist = (a, b) => a.reduce((s, p, i) => s + Math.hypot(p[0] - b[i][0], p[1] - b[i][1]), 0) / a.length;
function judge(user, ch){
  const ref = refStrokes(ch);
  if (user.length !== ref.length)
    return { ok:false, hint:`「${ch}」は ${ref.length}かく で かくよ。いまは ${user.length}かく だね`, why:'count' };
  const U = normalize(user.map(s => resample(s))), R = normalize(ref.map(s => resample(s)));
  // むき：はじまり→おわり が はんたいなら ×（ソ と ン など）
  const rv = R.findIndex((r, i) => reversed(U[i], r));
  if (rv >= 0)
    return { ok:false, why:'dir', hint:`${rv + 1}ばんめの せんの むきが ぎゃく みたい。どこから かきはじめるかな？` };
  let total = 0, worst = 0, worstD = -1;
  U.forEach((u, i) => { const d = pdist(u, R[i]); total += d; if (d > worstD){ worstD = d; worst = i; } });
  const mean = total / U.length;
  if (worstD < TH_STROKE && mean < TH_MEAN) return { ok:true, mean, worstD };
  const n = worst + 1;
  const rev = pdist([...U[worst]].reverse(), R[worst]);
  if (rev < TH_STROKE && rev < worstD * 0.6)
    return { ok:false, why:'dir', mean, worstD, hint:`${n}ばんめの せんの むきが ぎゃく みたい。どこから かきはじめるかな？` };
  const other = R.findIndex((r, j) => j !== worst && pdist(U[worst], r) < TH_STROKE);
  if (other >= 0)
    return { ok:false, why:'order', mean, worstD, hint:'かきじゅんが ちがうかも。ばんごうを よくみてね' };
  return { ok:false, why:'shape', mean, worstD, hint:`${n}ばんめの せんの かたちや ばしょを よくみてね` };
}

/* ---------- てがき キャンバス ---------- */
function fitCanvas(){
  const r = $('#wbox').getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  redraw();
}
function redraw(){
  ctx.clearRect(0, 0, cv.width, cv.height);
  const W = cv.width, H = cv.height;
  ctx.strokeStyle = ctx.fillStyle = '#2b2320';
  ctx.lineWidth = W * 0.05; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  strokes.forEach(s => {
    if (s.length === 1){ ctx.beginPath(); ctx.arc(s[0][0] * W, s[0][1] * H, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill(); return; }
    ctx.beginPath(); ctx.moveTo(s[0][0] * W, s[0][1] * H);
    for (let i = 1; i < s.length - 1; i++){
      const mx = (s[i][0] + s[i + 1][0]) / 2, my = (s[i][1] + s[i + 1][1]) / 2;
      ctx.quadraticCurveTo(s[i][0] * W, s[i][1] * H, mx * W, my * H);
    }
    const last = s[s.length - 1]; ctx.lineTo(last[0] * W, last[1] * H);
    ctx.stroke();
  });
}
const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
cv.addEventListener('pointerdown', e => { e.preventDefault(); drawing = true; cv.setPointerCapture(e.pointerId); strokes.push([pt(e)]); redraw(); });
cv.addEventListener('pointermove', e => {
  if (!drawing) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  evs.forEach(ev => strokes[strokes.length - 1].push(pt(ev)));
  redraw();
});
['pointerup','pointercancel'].forEach(t => cv.addEventListener(t, () => { drawing = false; }));
window.addEventListener('resize', () => { if ($('#kaki').classList.contains('active')) fitCanvas(); });

renderSettings();
</script>
